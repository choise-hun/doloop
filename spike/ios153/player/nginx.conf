# M1A-1 스파이크 전용. Cloud Run(포트 8080)용 정적 서버.
server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://www.youtube.com/iframe_api https://www.youtube.com/s/player/; frame-src https://www.youtube.com; style-src 'unsafe-inline'; img-src https://i.ytimg.com; frame-ancestors capacitor://localhost https://localhost; base-uri 'none'; object-src 'none'; form-action 'none'" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Cache-Control "no-store" always;

  location / {
    try_files $uri $uri/index.html =404;
  }
}
