name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR이 문서(*.md, docs/, 개발산출물/)만 바꿨으면 아래 테스트를 건너뜁니다.
  # 워크플로 paths-ignore를 쓰면 필수 체크가 '대기'로 남아 머지가 막히므로 작업 단위로 거릅니다
  # 이미 코드가 들어간 PR에 문서만 추가 push하면(진행 파일·결과 기록) 새 커밋만 보고, 직전 커밋의 'CI ok'가
  # 성공이었을 때만 건너뜁니다. 직전 실행이 취소·실패였거나 force push면 전부 다시 돕니다
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; echo "backend=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          docs_only() { [ -z "$(echo "$1" | grep -vE '(\.md$|^docs/|^개발산출물/)' | grep -v '^$' || true)" ]; }

          files=$(git -c core.quotePath=false diff --name-only "$BASE"...HEAD)
          echo "== PR 전체 변경"; echo "$files"
          # Kotlin 테스트는 서버·빌드 설정을 건드린 PR에서만 돈다(프론트만 바꾼 PR은 약 3분 절약). main push는 항상 실행
          if echo "$files" | grep -qE '^(src/|gradle/|gradlew|build\.gradle|settings\.gradle|Dockerfile|supabase/)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if docs_only "$files"; then echo "code=false" >> "$GITHUB_OUTPUT"; echo "문서만 변경 — 테스트 건너뜀"; exit 0; fi

          if [ "$ACTION" = "synchronize" ] && [ -n "$BEFORE" ] && git merge-base --is-ancestor "$BEFORE" "$HEAD_SHA" 2>/dev/null; then
            new=$(git -c core.quotePath=false diff --name-only "$BEFORE" "$HEAD_SHA")
            echo "== 이번 push로 바뀐 것 ($BEFORE..$HEAD_SHA)"; echo "$new"
            if docs_only "$new"; then
              ok=$(gh api "repos/$REPO/commits/$BEFORE/check-runs?check_name=CI%20ok&per_page=20" \
                --jq '[.check_runs[] | select(.conclusion == "success")] | length' || echo 0)
              if [ "${ok:-0}" -gt 0 ]; then
                echo "code=false" >> "$GITHUB_OUTPUT"; echo "이번 push는 문서만 + 직전 커밋 CI 통과 — 테스트 건너뜀"; exit 0
              fi
              echo "직전 커밋의 CI ok 성공 기록 없음 — 전부 실행"
            fi
          fi
          echo "code=true" >> "$GITHUB_OUTPUT"

  test:
    name: Test (Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20은 2026-04 지원 종료. Dockerfile(node:22)과 다음 LTS(24)로 확인합니다
        # 분(minute) 절약: PR은 22만, main push에서 24까지 확인한다
        node: ${{ github.event_name == 'pull_request' && fromJSON('[22]') || fromJSON('[22, 24]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  e2e-security:
    name: E2E XSS & CSP (Playwright, spa)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Playwright가 ubuntu 26.04를 지원하지 않아(2026-11-11 새 레포 CI에서 확인) 24.04로 고정한다
    runs-on: ubuntu-24.04
    # `playwright install --with-deps`의 apt 단계가 러너 DNS 장애(azure.archive.ubuntu.com 해석 실패)로
    # 반복 실패해(2026-11-11 run 43033920534·43040606154) 브라우저·OS 의존성이 들어 있는 공식 이미지에서 돌린다.
    # 이미지 태그는 package.json의 @playwright/test 버전과 반드시 같게 올린다(다르면 브라우저 실행 파일 불일치).
    container:
      image: mcr.microsoft.com/playwright:v1.51.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright 버전과 컨테이너 이미지 일치 확인
        run: |
          want="$(node -p "require('./package.json').devDependencies['@playwright/test']")"
          have="$(npx playwright --version | awk '{print $2}')"
          echo "package.json=$want installed=$have image=v1.51.1"
          test "$want" = "1.51.1" && test "$have" = "1.51.1"
      - run: npm run build
      - run: npm run test:e2e

  # Kotlin 서버(K0-1 이후). gradlew가 생기면 CI 수정 없이 ./gradlew test가 돌기 시작합니다
  kotlin:
    name: Kotlin test (JDK 21)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: detect
        run: |
          if [ -f gradlew ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "gradlew 없음 — Kotlin 테스트 건너뜀"; fi
      - if: steps.detect.outputs.found == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - if: steps.detect.outputs.found == 'true'
        uses: gradle/actions/setup-gradle@v5
      - if: steps.detect.outputs.found == 'true'
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: [test, kotlin]
    # kotlin은 백엔드 변경이 없으면 건너뛴다. 건너뜀(skipped)은 통과로 본다
    if: ${{ !cancelled() && needs.test.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.kotlin.result) }}
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t guitar-chord-lab:ci .
      - name: Run container
        run: docker run -d --name app -p 3000:3000 guitar-chord-lab:ci
      - name: Health check
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo; echo "healthy"; exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1
      - name: SPA entry served (React)
        run: |
          curl -fsS http://127.0.0.1:3000/ | grep -q 'id="root"'
          ASSET=$(curl -fsS http://127.0.0.1:3000/practice.html | grep -oE '/assets/index-[^"]+\.js' | head -1)
          test -n "$ASSET"
          curl -fsS -o /dev/null "http://127.0.0.1:3000${ASSET}"
      - name: Cleanup
        if: always()
        run: |
          docker rm -f app || true

  # ruleset 필수 체크는 이 작업 하나만 건다. 테스트를 건너뛴 문서 PR은 통과, 하나라도 실패·취소면 실패
  ci-ok:
    name: CI ok
    runs-on: ubuntu-latest
    needs: [changes, test, e2e-security, kotlin, docker]
    if: always()
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac

